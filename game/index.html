<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Porto Verde — open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1c2c; font-family: Verdana, Geneva, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,.55); padding: 8px 16px; border-radius: 6px; font-size: 15px; display: none; z-index: 6; }
  #start-screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; background: linear-gradient(180deg, rgba(6,32,52,.82) 0%, rgba(6,32,52,.55) 55%, rgba(6,32,52,.88) 100%); cursor: pointer; }
  #start-screen h1 { margin: 0 0 6px; font-size: 64px; letter-spacing: 6px; color: #ffd166; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
  #start-screen h2 { margin: 0 0 18px; font-size: 18px; font-weight: normal; color: #cfeef7; letter-spacing: 2px; }
  #start-screen p { margin: 4px 0; font-size: 15px; color: #e8f4f8; }
  #start-screen .play { margin-top: 22px; font-size: 20px; font-weight: bold; color: #08222f; background: #ffd166; padding: 12px 34px; border-radius: 8px; }
  #start-screen .keys { margin-top: 20px; font-size: 13px; color: #a9c6d2; line-height: 1.7; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="toast"></div>
<div id="start-screen">
  <h1>PORTO VERDE</h1>
  <h2>AN OPEN-WORLD CRIME GAME &middot; A SUN-SOAKED PORT CITY OF YOUR OWN</h2>
  <p>Explore the city on foot or by car. Steal a car, outrun the law, take on jobs.</p>
  <div class="play">CLICK TO PLAY</div>
  <div class="keys">
    WASD move &middot; Mouse look &middot; Shift run &middot; E enter / exit car<br>
    W A S D drive &middot; Space brake &middot; Arrow keys turn camera &middot; Ctrl+S save
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
